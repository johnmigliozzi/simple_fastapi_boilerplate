<!DOCTYPE html>
<html lang="en">
    <head>
        <title></title>
        <meta name="Author" content="John Migliozzi">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <link rel="stylesheet" type="text/css" href="./style.css" />
        <link rel="icon" href="./favicon.ico" type="image/x-icon">
        <script src="./app.js"></script>
    </head>
    <body>
        <form class="login_form" id="login_form">
            <div class="username_div">
              <input type="text" id="username_id" name="username" placeholder="Username"><br>
            </div>
            <div class="password_div">
              <input type="password" id="password_id" name="password" placeholder="Password">
            </div>
            <div class="btn_div">
              <input type="button" id="btn_id" value="Login" class="login_btn" onclick="token(document.getElementById('username_id').value,document.getElementById('password_id').value)">
            </div>
          </form>
        <div id="logged-in-as-user">Not logged in.</div>
        <button onclick="doStuff()">Do Stuff</button>
        <input type="text" id="selected_data_id" />
        <button onclick="getData()">Get Data</button>
        <div id="data_results"></div>
    </body>
</html>
